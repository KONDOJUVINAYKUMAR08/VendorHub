events {}

http {
  server {
    listen 80;

    # Auth
    location /api/auth/ {
      proxy_pass http://auth-service:5001/api/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Vendor
    location /api/vendors/ {
      proxy_pass http://vendor-service:5002/api/vendors/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Document
    location /api/documents/ {
      proxy_pass http://document-service:5003/api/documents/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Workflow
    location /api/workflow/ {
      proxy_pass http://workflow-service:5004/api/workflow/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Compliance
    location /api/compliance/ {
      proxy_pass http://compliance-service:5005/api/compliance/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Audit
    location /api/audit/ {
      proxy_pass http://audit-service:5006/api/audit/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Notification
    location /api/notifications/ {
      proxy_pass http://notification-service:5007/api/notifications/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Health for gateway
    location /health {
      return 200 "gateway ok\n";
      add_header Content-Type text/plain;
    }
  }
}